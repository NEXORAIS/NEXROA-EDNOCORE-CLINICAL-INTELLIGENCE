<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="NEXORA logo">
  <title>NEXORA — EndoCore | Clinical Intelligence</title>
  <!-- Rediseño 3D (11-ago-2026, a petición del Dr. Ortega — inspirado en el
       ícono glossy de referencia que envió): mismos 5 nodos/red que el logo
       original, pero cada nodo ahora es una esfera con gradiente radial
       (luz arriba-izquierda, sombra abajo-derecha, igual que una canica de
       vidrio) en vez de un círculo plano, y el badge de fondo tiene un
       barniz diagonal (glass sheen) + sombra interna para dar profundidad
       real incluso como imagen estática (splashLogoShine en index.html
       agrega el barrido de luz animado encima de esto para la versión que
       gira en el splash). -->
  <defs>
    <linearGradient id="nexoraBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#122a4d"/>
    </linearGradient>
    <linearGradient id="nexoraLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Esferas: gradiente radial descentrado (luz arriba-izq) simula una
         superficie curva iluminada, igual que las esferas del ícono de
         referencia. -->
    <radialGradient id="nexoraSphere" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="nexoraSphereCenter" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="30%" stop-color="#93c5fd"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <!-- Barniz diagonal sobre el badge (glass sheen estático). -->
    <linearGradient id="nexoraSheen" x1="10%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="nexoraDepth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#nexoraBadgeBg)"/>
  <!-- Sombra interna sutil (borde inferior/derecho más oscuro) para que el
       badge no se vea plano. -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.3">
    <line x1="30" y1="74" x2="50" y2="50"/>
    <line x1="50" y1="50" x2="70" y2="26"/>
  </g>

  <g stroke="url(#nexoraLine)" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="30" y1="26" x2="30" y2="74"/>
    <line x1="70" y1="26" x2="70" y2="74"/>
    <line x1="30" y1="26" x2="50" y2="50"/>
    <line x1="50" y1="50" x2="70" y2="74"/>
  </g>

  <g filter="url(#nexoraDepth)">
    <circle cx="30" cy="26" r="6.5" fill="url(#nexoraSphere)"/>
    <circle cx="70" cy="26" r="6.5" fill="url(#nexoraSphere)"/>
    <circle cx="30" cy="74" r="6.5" fill="url(#nexoraSphere)"/>
    <circle cx="70" cy="74" r="6.5" fill="url(#nexoraSphere)"/>
    <circle cx="50" cy="50" r="7.5" fill="url(#nexoraSphereCenter)"/>
  </g>
  <!-- Punto de brillo especular (highlight) en cada esfera — el detalle que
       más vende el efecto "canica de vidrio" en el ícono de referencia. -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="27.8" cy="23.6" rx="1.7" ry="1.1" transform="rotate(-35 27.8 23.6)"/>
    <ellipse cx="67.8" cy="23.6" rx="1.7" ry="1.1" transform="rotate(-35 67.8 23.6)"/>
    <ellipse cx="27.8" cy="71.6" rx="1.7" ry="1.1" transform="rotate(-35 27.8 71.6)"/>
    <ellipse cx="67.8" cy="71.6" rx="1.7" ry="1.1" transform="rotate(-35 67.8 71.6)"/>
    <ellipse cx="47.3" cy="46.9" rx="2" ry="1.3" transform="rotate(-35 47.3 46.9)"/>
  </g>

  <!-- Barniz diagonal encima de todo -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#nexoraSheen)"/>
</svg>
